<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f7fb;
        }

        button {
            margin-top: 100px;
            padding: 15px 30px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            transition: transform 0.3s, background-color 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #1e40af;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button>Hover Me</button>

</body>
</html>

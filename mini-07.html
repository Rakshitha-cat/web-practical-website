<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
</head>
<body>

<h2>Quiz App</h2>

<p id="question"></p>

<div id="options"></div>

<p id="result"></p>

<script>
let questions = [
    {
        question: "Which language is used for web pages?",
        options: ["HTML", "Python", "Java", "C++"],
        answer: "HTML"
    },
    {
        question: "Which language is used for webpage behavior?",
        options: ["CSS", "JavaScript", "SQL", "C"],
        answer: "JavaScript"
    },
    {
        question: "Which is used for styling?",
        options: ["HTML", "CSS", "Java", "Python"],
        answer: "CSS"
    }
];

let current = 0;
let score = 0;

function showQuestion() {
    let q = questions[current];

    document.getElementById("question").innerHTML = q.question;

    let options = document.getElementById("options");
    options.innerHTML = "";

    q.options.forEach(function(option) {
        let button = document.createElement("button");

        button.innerHTML = option;

        button.onclick = function() {
            checkAnswer(option);
        };

        options.appendChild(button);
        options.appendChild(document.createElement("br"));
    });
}

function checkAnswer(option) {
    if (option == questions[current].answer) {
        score++;
    }

    current++;

    if (current < questions.length) {
        showQuestion();
    } else {
        document.getElementById("question").innerHTML = "Quiz Completed";
        document.getElementById("options").innerHTML = "";
        document.getElementById("result").innerHTML =
            "Your Score: " + score + "/" + questions.length;
    }
}

showQuestion();
</script>

</body>
</html>

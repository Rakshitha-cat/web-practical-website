<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 8</title>
</head>
<body>

<h1>JavaScript Program 8</h1>

<p>Write a program to check whether a number is prime.</p>

<input type="number" id="number" placeholder="Enter a number">

<button onclick="checkPrime()">Check</button>

<p id="output"></p>

<script>
function checkPrime() {
    let number = Number(document.getElementById("number").value);
    let isPrime = true;

    if (number < 2) {
        isPrime = false;
    }

    for (let i = 2; i < number; i++) {
        if (number % i === 0) {
            isPrime = false;
            break;
        }
    }

    if (isPrime) {
        document.getElementById("output").innerHTML =
            number + " is a Prime number";
    } else {
        document.getElementById("output").innerHTML =
            number + " is not a Prime number";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Events 04 - Double Click</title>
</head>
<body>

<h2>Double-Click Event</h2>

<button id="btn">Double Click Me</button>

<p id="message">Double-click the button</p>

<script>
document.getElementById("btn").ondblclick = function() {
    document.getElementById("message").textContent =
        "Button was double-clicked!";
};
</script>

</body>
</html>

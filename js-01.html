<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 1</title>
</head>
<body>

<h1>JavaScript Program 1</h1>

<p>Write a JavaScript program to display "Hello World".</p>

<button onclick="displayMessage()">Click Here</button>

<p id="output"></p>

<script>
function displayMessage() {
    document.getElementById("output").innerHTML = "Hello World";
}
</script>

</body>
</html>

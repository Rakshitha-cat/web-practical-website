<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Program 7</title>
</head>
<body>

<h1>JavaScript Program 7</h1>

<p>Write a program to generate the Fibonacci series.</p>

<input type="number" id="number" placeholder="Enter number of terms">

<button onclick="generateFibonacci()">Generate</button>

<p id="output"></p>

<script>
function generateFibonacci() {
    let n = Number(document.getElementById("number").value);

    let a = 0;
    let b = 1;
    let series = "";

    for (let i = 0; i < n; i++) {
        series = series + a + " ";

        let next = a + b;
        a = b;
        b = next;
    }

    document.getElementById("output").innerHTML =
        "Fibonacci Series: " + series;
}
</script>

</body>
</html>

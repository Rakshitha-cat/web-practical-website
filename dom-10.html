<!DOCTYPE html>
<html>
<head>
    <title>DOM 10 - Search Table</title>
</head>
<body>

<h2>Search Student Records</h2>

<input type="text" id="search" placeholder="Search name..." onkeyup="searchTable()">

<br><br>

<table border="1" cellpadding="10" id="studentTable">

    <tr>
        <th>Name</th>
        <th>Course</th>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>BCA</td>
    </tr>

    <tr>
        <td>Priya</td>
        <td>B.Sc</td>
    </tr>

    <tr>
        <td>Arjun</td>
        <td>B.Tech</td>
    </tr>

    <tr>
        <td>Anjali</td>
        <td>BCA</td>
    </tr>

</table>

<script>
function searchTable() {

    let input = document.getElementById("search").value.toLowerCase();

    let rows = document.querySelectorAll("#studentTable tr");

    for (let i = 1; i < rows.length; i++) {

        let name = rows[i].cells[0].textContent.toLowerCase();

        if (name.includes(input)) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>

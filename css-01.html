<!DOCTYPE html>
<html>
<head>
    <title>Inline Internal External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">Inline CSS</h1>

    <!-- Internal CSS -->
    <h2>Internal CSS</h2>

    <!-- External CSS -->
    <p>This paragraph uses External CSS.</p>

</body>
</html>

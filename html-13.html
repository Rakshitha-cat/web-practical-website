<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            width: 80%;
            margin: auto;
            padding: 30px;
            background-color: lightblue;
            text-align: center;
        }

        @media screen and (max-width: 600px) {
            .box {
                width: 90%;
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Responsive Webpage</h1>
    <p>Resize the browser window to see the effect.</p>
</div>

</body>
</html>

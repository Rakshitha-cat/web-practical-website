<!DOCTYPE html>
<html>
<head>
    <title>DOM 15 - Image Slideshow</title>
</head>
<body>

<h2>Image Slideshow</h2>

<img id="slide" src="https://picsum.photos/id/1015/500/300" width="500">

<br><br>

<button onclick="previousImage()">Previous</button>
<button onclick="nextImage()">Next</button>

<script>
let images = [
    "https://picsum.photos/id/1015/500/300",
    "https://picsum.photos/id/1016/500/300",
    "https://picsum.photos/id/1018/500/300",
    "https://picsum.photos/id/1020/500/300"
];

let index = 0;

function nextImage() {

    index++;

    if (index >= images.length) {
        index = 0;
    }

    document.getElementById("slide").src = images[index];
}

function previousImage() {

    index--;

    if (index < 0) {
        index = images.length - 1;
    }

    document.getElementById("slide").src = images[index];
}
</script>

</body>
</html>

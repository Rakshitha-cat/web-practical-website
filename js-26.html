<!DOCTYPE html>

<body>

<h1>JavaScript Program 26</h1>

<img id="myImage"
     src="image2.jpeg"
     width="200">

<br><br>

<button onclick="changeImage()">Change Image</button>

<script>
function changeImage() {
    document.getElementById("myImage").src =
        "image2.jpeg";
}
</script>

</body>
